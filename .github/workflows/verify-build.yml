name: Verify Windows build and Defender scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-build.yml'
      - 'ci/**'
      - 'src/**'
      - 'native/**'
      - 'vendor/**'
      - 'build-live.ps1'
      - 'test-contrast.ps1'
      - 'create-background.ps1'
      - 'docs/BUILD-CANDIDATE.md'
      - 'LICENSE.txt'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test verification failures using harmless fixtures
        run: ./ci/Test-DefenderScan.ps1
      - name: Build from source and scan without executing the application
        run: ./ci/Invoke-VerifiedBuild.ps1
      - name: Package the candidate after successful verification
        run: ./ci/Package-Candidate.ps1
      - name: Upload the verified experimental candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dark1C-experimental-windows-x64
          path: ci/package/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-reports
          path: ci/reports/*.json
          if-no-files-found: warn
          retention-days: 14
